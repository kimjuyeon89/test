<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>접근성을 준수한 전체메뉴</title>

  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css"
  >
  <!-- KRDS 원본은 수정하지 않고 프로젝트 CSS에서 필요한 화면만 재정의합니다. -->
  <link rel="stylesheet" href="./tab4.css">

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"
  ></script>
  <script defer src="./tab4.js"></script>
</head>
<body>
  <!-- KRDS 모달이 열릴 때 배경을 비활성화할 수 있도록 #wrap으로 묶습니다. -->
  <div id="wrap">
    <main class="page-content" inert aria-hidden="true">
      <button
        type="button"
        class="krds-btn medium primary all-menu-trigger js-all-menu-open"
        aria-haspopup="dialog"
        aria-controls="all-menu-popup"
        aria-expanded="true"
      >
        전체메뉴 열기
      </button>
    </main>

    <div class="all-menu-layer js-all-menu-layer">
      <section
        id="all-menu-popup"
        class="all-menu-popup js-all-menu-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="all-menu-title"
      >
        <header class="all-menu-header">
          <h1 id="all-menu-title" tabindex="-1">전체메뉴</h1>
          <div class="all-menu-tools">
            <button
              type="button"
              class="krds-btn small text open-modal display-setting-button"
              data-target="modal_adjust_display"
              aria-haspopup="dialog"
              aria-controls="modal_adjust_display"
            >
              <i class="svg-icon ico-view-mode" aria-hidden="true"></i>
              글자·화면 설정
            </button>
            <button type="button" class="all-menu-close js-all-menu-close" aria-label="전체메뉴 닫기">
              <img src="./images/icon-close.svg" alt="닫기">
            </button>
          </div>
        </header>

        <div class="krds-tab-area layer all-menu-layout">
          <div class="tab line full all-menu-tabs">
            <ul role="tablist" aria-label="전체메뉴">
              <li
                id="tab_menu_01"
                class="active"
                role="tab"
                aria-selected="true"
                aria-controls="panel_menu_01"
              >
                <button
                  type="button"
                  class="btn-tab all-menu-tab"
                >메뉴1</button>
              </li>
              <li
                id="tab_menu_02"
                role="tab"
                aria-selected="false"
                aria-controls="panel_menu_02"
              >
                <button
                  type="button"
                  class="btn-tab all-menu-tab"
                >메뉴2</button>
              </li>
              <li
                id="tab_menu_03"
                role="tab"
                aria-selected="false"
                aria-controls="panel_menu_03"
              >
                <button
                  type="button"
                  class="btn-tab all-menu-tab"
                >메뉴3</button>
              </li>
              <li
                id="tab_menu_04"
                role="tab"
                aria-selected="false"
                aria-controls="panel_menu_04"
              >
                <button
                  type="button"
                  class="btn-tab all-menu-tab"
                >메뉴4</button>
              </li>
            </ul>

            <div class="all-menu-links">
              <a href="/related/service-1/">링크1</a>
              <a href="/related/service-2/">링크2</a>
            </div>
          </div>

          <div class="tab-conts-wrap all-menu-content">
            <section
              id="panel_menu_01"
              class="tab-conts active all-menu-panel"
              role="tabpanel"
              aria-labelledby="tab_menu_01"
              tabindex="0"
              data-quick-nav="false"
            >
              <h2 class="panel-heading">메뉴1</h2>
              <div class="menu-grid">
                <section class="menu-group">
                  <h3><a href="/menu1/group1/">메뉴명1</a></h3>
                  <ul>
                    <li>
                      <button
                        type="button"
                        class="submenu-button js-submenu-button"
                        aria-expanded="false"
                        aria-controls="submenu_01_01"
                      >
                        하위메뉴명
                      </button>
                      <ul id="submenu_01_01" class="submenu-list" hidden inert>
                        <li><a href="/menu1/group1/depth2-1/">2번째 하위메뉴명</a></li>
                        <li><a href="/menu1/group1/depth2-2/">2번째 하위메뉴명</a></li>
                        <li><a href="/menu1/group1/depth2-3/">2번째 하위메뉴명</a></li>
                      </ul>
                    </li>
                    <li><a href="/menu1/group1/item2/">하위메뉴명</a></li>
                    <li><a href="/menu1/group1/item3/">하위메뉴명</a></li>
                    <li><a href="/menu1/group1/item4/">하위메뉴명</a></li>
                  </ul>
                </section>
              </div>
            </section>

            <section
              id="panel_menu_02"
              class="tab-conts all-menu-panel"
              role="tabpanel"
              aria-labelledby="tab_menu_02"
              tabindex="0"
              data-quick-nav="false"
            >
              <h2 class="panel-heading">메뉴2</h2>
              <div class="menu-grid">
                <section class="menu-group">
                  <h3><a href="/menu2/service/">메뉴2 서비스</a></h3>
                  <ul>
                    <li><a href="/menu2/service/item1/">하위메뉴명</a></li>
                    <li><a href="/menu2/service/item2/">하위메뉴명</a></li>
                    <li><a href="/menu2/service/item3/">하위메뉴명</a></li>
                  </ul>
                </section>
              </div>
            </section>

            <section
              id="panel_menu_03"
              class="tab-conts all-menu-panel"
              role="tabpanel"
              aria-labelledby="tab_menu_03"
              tabindex="0"
              data-quick-nav="false"
            >
              <h2 class="panel-heading">메뉴3</h2>
              <div class="menu-grid">
                <section class="menu-group">
                  <h3><a href="/menu3/service/">메뉴3 서비스</a></h3>
                  <ul>
                    <li><a href="/menu3/service/item1/">하위메뉴명</a></li>
                    <li><a href="/menu3/service/item2/">하위메뉴명</a></li>
                  </ul>
                </section>
              </div>
            </section>

            <section
              id="panel_menu_04"
              class="tab-conts all-menu-panel"
              role="tabpanel"
              aria-labelledby="tab_menu_04"
              tabindex="0"
              data-quick-nav="false"
            >
              <h2 class="panel-heading">메뉴4</h2>
              <div class="menu-grid">
                <section class="menu-group">
                  <h3><a href="/menu4/service/">메뉴4 서비스</a></h3>
                  <ul>
                    <li><a href="/menu4/service/item1/">하위메뉴명</a></li>
                    <li><a href="/menu4/service/item2/">하위메뉴명</a></li>
                  </ul>
                </section>
              </div>
            </section>

            <div class="all-menu-actions">
              <button type="button" class="all-menu-action">
                <img src="./images/icon-cancel.svg" alt="">
                <span>취소</span>
              </button>
              <button type="button" class="all-menu-action">
                <img src="./images/icon-save.svg" alt="">
                <span>임시저장</span>
              </button>
              <button type="button" class="all-menu-action">
                <img src="./images/icon-confirm.svg" alt="">
                <span>확인</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- KRDS 글자·화면 설정 모달은 #wrap 밖에 두어 배경과 분리합니다. -->
  <section
    id="modal_adjust_display"
    class="krds-modal fade"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tit_modal_adjust_display"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="tit_modal_adjust_display" class="modal-title">글자·화면 표시 설정</h2>
        </div>

        <div class="modal-conts">
          <div class="conts-area">
            <div class="adjust_display display-setting">
              <fieldset class="adjust_scale display-setting-group display-setting-scale-group">
                <legend class="display-setting-legend">글자·화면 표시 설정</legend>
                <div class="form-group display-scale-options">
                  <div class="form-conts">
                    <div class="krds-check-area chk-column">
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_small" value="small">
                        <label for="scale_level_small">작게</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_medium" value="medium" checked>
                        <label for="scale_level_medium">보통</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_large" value="large">
                        <label for="scale_level_large">조금 크게</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_xlarge" value="xlarge">
                        <label for="scale_level_xlarge">크게</label>
                      </div>
                      <div class="krds-form-check">
                        <input type="radio" name="scale_level" id="scale_level_xxlarge" value="xxlarge">
                        <label for="scale_level_xxlarge">가장 크게</label>
                      </div>
                    </div>
                  </div>
                </div>
              </fieldset>

              <fieldset class="display-setting-group">
                <legend class="display-setting-legend">화면 표시 모드</legend>
                <div class="form-group display-mode-options">
                  <div class="form-conts">
                    <div class="krds-check-area chk-column">
                      <div class="krds-form-check screen-preview-light">
                        <input type="radio" name="view_mode" id="view_mode_light" value="light" checked>
                        <label for="view_mode_light">기본 (밝은 배경)</label>
                      </div>
                      <div class="krds-form-check screen-preview-dark">
                        <input type="radio" name="view_mode" id="view_mode_dark" value="high-contrast">
                        <label for="view_mode_dark">선명하게 (어두운 배경)</label>
                      </div>
                      <div class="krds-form-check screen-preview-system">
                        <input type="radio" name="view_mode" id="view_mode_default" value="theme">
                        <label for="view_mode_default">시스템 설정</label>
                      </div>
                    </div>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>
        </div>

        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium tertiary close-modal" id="reset_display">초기화</button>
          <button type="button" class="krds-btn medium primary close-modal">닫기</button>
        </div>

        <button type="button" class="krds-btn medium icon btn-close close-modal" aria-label="글자·화면 설정 닫기">
          <i class="svg-icon ico-popup-close" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="modal-back" aria-hidden="true"></div>
  </section>
</body>
</html>
